<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực hành Bảng trong CSS</title>
    <style>
        /* Thiết lập độ rộng, gộp đường viền trùng lặp */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Định kiểu đường viền và padding cho header/cell */
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        /* Định kiểu cho tiêu đề bảng: chiều cao, căn trái, màu nền và chữ */
        th {
            height: 50px;
            text-align: left;
            background-color: #04AA6D;
            color: white;
        }

        /* Căn chỉnh chiều dọc và tô màu nền xem kẽ cho dòng */
        td {
            vertical-align: bottom;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Thực hành Định kiểu Bảng trong CSS</h1>

    <table>
        <thead>
            <tr>
                <th>Họ và tên</th>
                <th>Chức vụ</th>
                <th>Mức lương</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>Lập trình viên Front-end</td>
                <td>15.000.000 VNĐ</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>Thiết kế UI/UX</td>
                <td>14.000.000 VNĐ</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td>Quản lý dự án</td>
                <td>25.000.000 VNĐ</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
