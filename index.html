<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>
</head>
<body>

    <h1>Lịch họp công ty</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Ngày</th>
                <th>Giờ</th>
                <th>Nội dung cuộc họp</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Thứ Hai</td>
                <td>08:00 - 09:00</td>
                <td>Họp giao ban đầu tuần</td>
            </tr>
            <tr>
                <td>10:00 - 11:30</td>
                <td>Thảo luận dự án mới</td>
            </tr>
            <tr>
                <td rowspan="2">Thứ Ba</td>
                <td colspan="2">08:00 - 12:00: Đào tạo nhân sự toàn công ty (Cả buổi sáng)</td>
            </tr>
            <tr>
                <td>14:00 - 15:30</td>
                <td>Họp phòng kỹ thuật</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
