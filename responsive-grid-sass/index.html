<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid with SASS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <h1>Responsive Grid Layout</h1>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-4">
                <div class="card">
                    <h3>Cột 1</h3>
                    <p>Nội dung mẫu cho cột thứ nhất trong hệ thống Grid.</p>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <h3>Cột 2</h3>
                    <p>Nội dung mẫu cho cột thứ hai trong hệ thống Grid.</p>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <h3>Cột 3</h3>
                    <p>Nội dung mẫu cho cột thứ ba trong hệ thống Grid.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
