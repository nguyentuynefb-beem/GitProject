<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bài tập Tạo Form Đơn Giản</title><style>body{font-family:Arial,sans-serif;margin:20px}.form-container{background-color:#f9f9f9;border:1px solid #ccc;padding:20px;border-radius:8px;max-width:500px;margin-bottom:30px}h2{color:#333;margin-top:0}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:5px;font-weight:bold}.form-group input[type="text"],.form-group input[type="email"],.form-group input[type="tel"],.form-group select,.form-group textarea{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}.checkbox-group label,.radio-group label{font-weight:normal;margin-right:15px}.btn-group input{padding:8px 15px;margin-right:10px;border:none;border-radius:4px;cursor:pointer}.btn-submit{background-color:#4CAF50;color:#fff}.btn-reset{background-color:#f44336;color:#fff}</style></head><body><!-- PHẦN 1: FORM KHẢO SÁT SỞ THÍCH --><div class="form-container"><h2>Phần 1: Form Khảo Sát</h2><form method="post" action="#"><div class="form-group"><label for="yourname">Họ và tên:</label><input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required/></div><div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" placeholder="Nhập email" required/></div><div class="form-group checkbox-group"><label>Sở thích:</label><label><input type="checkbox" name="hobby" value="sports"/> Thể thao</label><label><input type="checkbox" name="hobby" value="music"/> Âm nhạc</label><label><input type="checkbox" name="hobby" value="reading"/> Đọc sách</label><label><input type="checkbox" name="hobby" value="travel"/> Du lịch</label></div><div class="btn-group"><input type="submit" class="btn-submit" value="Gửi thông tin"/><input type="reset" class="btn-reset" value="Nhập lại"/></div></form></div><!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN --><div class="form-container"><h2>Phần 2: Form Đăng Ký Học Viên</h2><form method="post" action="#"><div class="form-group"><label for="fullname">Full Name (Họ và tên):</label><input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required/></div><div class="form-group"><label for="student_email">Email:</label><input type="email" id="student_email" name="student_email" placeholder="example@gmail.com" required/></div><div class="form-group"><label for="phone">Phone Number (Số điện thoại):</label><input type="tel" id="phone" name="phone" placeholder="0901234567"/></div><div class="form-group radio-group"><label>Gender (Giới tính):</label><label><input type="radio" name="gender" value="male" checked/> Male (Nam)</label><label><input type="radio" name="gender" value="female"/> Female (Nữ)</label><label><input type="radio" name="gender" value="other"/> Other (Khác)</label></div><div class="form-group"><label for="course">Course (Khóa học đăng ký):</label><select id="course" name="course"><option value="html_css">HTML & CSS Basic</option><option value="javascript">JavaScript Fundamentals</option><option value="python">Python Programming</option></select></div><div class="form-group"><label for="note">Note / Message (Ghi chú):</label><textarea id="note" name="note" rows="4" placeholder="Nhập ghi chú thêm..."></textarea></div><div class="btn-group"><input type="submit" class="btn-submit" value="Register (Đăng ký)"/><input type="reset" class="btn-reset" value="Reset (Làm lại)"/></div></form></div></body></html>
