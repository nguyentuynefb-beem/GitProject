<!DOCTYPE html><html><head><meta charset="utf-8"><title>Market Research Survey</title><style>body{font-family:Arial,sans-serif;background-color:#f0f2f5;padding:20px}.survey-container{background-color:#fff;max-width:700px;margin:0 auto;padding:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}h1{margin-top:0;color:#333;font-size:24px}p.description{color:#666;font-size:14px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:15px}.form-group{margin-bottom:20px}.form-group label.title{display:block;font-weight:bold;margin-bottom:8px;color:#333}.form-group input[type="text"],.form-group input[type="email"],.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;font-size:14px}.survey-table{width:100%;border-collapse:collapse;margin-top:10px}.survey-table th,.survey-table td{border:1px solid #e0e0e0;padding:10px;text-align:center;font-size:13px}.survey-table th{background-color:#f8f9fa;color:#444;font-weight:600}.survey-table td.question{text-align:left;font-weight:500;color:#333}.survey-table tr:nth-child(even){background-color:#fafafa}.btn-submit{background-color:#0066cc;color:#fff;padding:10px 20px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;font-size:14px}.btn-submit:hover{background-color:#0052a3}</style></head><body><div class="survey-container"><h1>Market Research Survey</h1><p class="description">Please take a few minutes to give us feedback about our service by filling out the form below.</p><form method="post" action="#"><div class="form-group"><label class="title" for="age">What is your age range?</label><select id="age" name="age"><option value="">-- Select Age Range --</option><option value="under_18">Under 18</option><option value="18_24">18 - 24</option><option value="25_34">25 - 34</option><option value="35_50">35 - 50</option><option value="over_50">50+</option></select></div><div class="form-group"><label class="title" for="income">What is your yearly income range?</label><select id="income" name="income"><option value="">-- Select Income Range --</option><option value="0_25k">$0 - $25,000</option><option value="25k_50k">$25,001 - $50,000</option><option value="50k_100k">$50,001 - $100,000</option><option value="over_100k">$100,000+</option></select></div><div class="form-group"><label class="title">How satisfied are you with our product/service?</label><table class="survey-table"><thead><tr><th></th><th>Very Satisfied</th><th>Satisfied</th><th>Unsatisfied</th><th>Very Unsatisfied</th></tr></thead><tbody><tr><td class="question">Product Quality</td><td><input type="radio" name="quality" value="very_satisfied"/></td><td><input type="radio" name="quality" value="satisfied"/></td><td><input type="radio" name="quality" value="unsatisfied"/></td><td><input type="radio" name="quality" value="very_unsatisfied"/></td></tr><tr><td class="question">Customer Service</td><td><input type="radio" name="service" value="very_satisfied"/></td><td><input type="radio" name="service" value="satisfied"/></td><td><input type="radio" name="service" value="unsatisfied"/></td><td><input type="radio" name="service" value="very_unsatisfied"/></td></tr><tr><td class="question">Overall Experience</td><td><input type="radio" name="overall" value="very_satisfied"/></td><td><input type="radio" name="overall" value="satisfied"/></td><td><input type="radio" name="overall" value="unsatisfied"/></td><td><input type="radio" name="overall" value="very_unsatisfied"/></td></tr></tbody></table></div><div class="form-group"><label class="title" for="comments">Do you have any additional comments or suggestions?</label><textarea id="comments" name="comments" rows="4" placeholder="Type your feedback here..."></textarea></div><button type="submit" class="btn-submit">Submit Survey</button></form></div></body></html>
